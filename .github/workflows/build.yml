name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests

      - name: Publish
        shell: bash
        run: |
          dotnet publish windows -c Release -o out
          dotnet publish windows -c Release --self-contained true \
            -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out-sc
          mkdir dist
          cp out/Tickfind.exe dist/Tickfind.exe
          cp out-sc/Tickfind.exe dist/Tickfind-standalone.exe

      - uses: actions/upload-artifact@v4
        with:
          name: tickfind-windows
          path: dist

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Tickfind $GITHUB_REF_NAME" --notes-file .github/release-notes.md

  # The released APK is signed locally (docs/development.md); CI runs the tests and checks it builds.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test and build
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
